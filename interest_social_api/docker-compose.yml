# =============================================================================
# Interest Social API - Production Grade Docker Compose
# Multi-service orchestration with security hardening
# =============================================================================

version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service_name,environment"
    env: "OS_VERSION"

x-deploy-resources: &api-resources
  resources:
    limits:
      cpus: '2.0'
      memory: 1G
    reservations:
      cpus: '0.5'
      memory: 256M

services:
  # ---------------------------------------------------------------------------
  # API Application Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PYTHON_VERSION: "3.11"
        APP_VERSION: "1.0.0"
        BUILD_DATE: "${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
        VCS_REF: "${VCS_REF:-unknown}"
    image: interest-social-api:${IMAGE_TAG:-latest}
    container_name: interest-social-api
    restart: unless-stopped
    
    # Security configurations
    security_opt:
      - no-new-privileges:true
      # seccomp disabled for macOS compatibility during development
      # - seccomp:./security/container-seccomp.json
    # read_only filesystem disabled for macOS compatibility
    # read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # User configuration - disabled for macOS compatibility
    # user: "1000:1000"
    
    # Network configuration
    networks:
      - frontend
      - backend
    
    # Port mapping
    ports:
      - target: 5000
        published: ${API_PORT:-5000}
        protocol: tcp
        mode: host
    
    # Environment variables
    environment:
      # Application Settings
      - APP_ENV=${APP_ENV:-production}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      - JWT_REFRESH_TOKEN_EXPIRES=${JWT_REFRESH_TOKEN_EXPIRES:-2592000}
      
      # Database Configuration
      - DATABASE_URL=postgresql://${DB_USER:-appuser}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-interest_social}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      
      # Redis Configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-10}
      
      # Gunicorn Configuration
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - GUNICORN_BIND_ADDRESS=0.0.0.0
      - GUNICORN_BIND_PORT=5000
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_GRACEFUL_TIMEOUT=${GUNICORN_GRACEFUL_TIMEOUT:-120}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-50}
      
      # Security Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yourdomain.com}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-10}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
      # Encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECURITY_PASSWORD_SALT=${SECURITY_PASSWORD_SALT}
    
    # Volume mounts
    volumes:
      - type: bind
        source: ./logs
        target: /app/logs
        read_only: false
      - type: tmpfs
        target: /app/tmp
        tmpfs:
          size: 100M
          mode: 1770
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M
          mode: 1777
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Deployment configuration
    deploy:
      <<: *api-resources
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        monitor: 60s
    
    # Logging
    logging: *default-logging
    
    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # ulimits for resource control
    ulimits:
      nproc: 65535
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: interest-social-postgres
    restart: unless-stopped
    
    # Security configurations
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    
    # User configuration
    user: "999:999"
    
    # Network configuration
    networks:
      - backend
    
    # Port mapping (internal only in production)
    ports:
      - target: 5432
        published: ${DB_PORT:-5432}
        protocol: tcp
    
    # Environment variables
    environment:
      - POSTGRES_USER=${DB_USER:-appuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-interest_social}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.UTF-8
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    
    # Volume mounts
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./init-db
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./security/postgres-config.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-interest_social}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Deployment configuration
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    
    # Logging
    logging: *default-logging
    
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf

  # ---------------------------------------------------------------------------
  # Redis Cache Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: interest-social-redis
    restart: unless-stopped
    
    # Security configurations
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # User configuration
    user: "999:999"
    
    # Network configuration
    networks:
      - backend
    
    # Port mapping (internal only in production)
    ports:
      - target: 6379
        published: ${REDIS_PORT:-6379}
        protocol: tcp
    
    # Command with security options
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --loglevel notice
      --protected-mode yes
      --bind 0.0.0.0
    
    # Volume mounts
    volumes:
      - type: volume
        source: redis_data
        target: /data
      - type: bind
        source: ./security/redis-acl.conf
        target: /usr/local/etc/redis/redis-acl.conf
        read_only: true
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Deployment configuration
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Logging
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: interest-social-nginx
    restart: unless-stopped
    
    # Network configuration
    networks:
      - frontend
      - backend
    
    # Port mapping
    ports:
      - target: 80
        published: ${NGINX_HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${NGINX_HTTPS_PORT:-443}
        protocol: tcp
    
    # Environment variables
    environment:
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
    
    # Volume mounts
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
      - type: bind
        source: ./nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
      - type: bind
        source: ./nginx/logs
        target: /var/log/nginx
        read_only: false
      - type: volume
        source: nginx_cache
        target: /var/cache/nginx
      - type: volume
        source: nginx_run
        target: /var/run
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Deployment configuration
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    
    # Logging
    logging: *default-logging
    
    # Dependencies
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Prometheus Monitoring (optional)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: interest-social-prometheus
    restart: unless-stopped
    
    # Security configurations
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # User configuration
    user: "65534:65534"
    
    # Network configuration
    networks:
      - backend
    
    # Port mapping
    ports:
      - target: 9090
        published: ${PROMETHEUS_PORT:-9090}
        protocol: tcp
    
    # Volume mounts
    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus_data
        target: /prometheus
    
    # Command
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api=false'
    
    # Deployment configuration
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    # Logging
    logging: *default-logging
    
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Grafana Dashboard (optional)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: interest-social-grafana
    restart: unless-stopped
    
    # Security configurations
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # User configuration
    user: "472:472"
    
    # Network configuration
    networks:
      - backend
    
    # Port mapping
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3000}
        protocol: tcp
    
    # Environment variables
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    
    # Volume mounts
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    
    # Deployment configuration
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Logging
    logging: *default-logging
    
    # Dependencies
    depends_on:
      - prometheus
    
    profiles:
      - monitoring

# =============================================================================
# Networks
# =============================================================================
networks:
  frontend:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.1

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/grafana
  nginx_cache:
    driver: local
  nginx_run:
    driver: local
