# Redis ACL Configuration
# Production security settings

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command SAVE ""
rename-command BGSAVE ""

# Keep these commands but with restricted access if needed
# rename-command KEYS ""

# ACL Rules
# Format: user <username> on/off <password> <key-patterns> <command-patterns>

# Default user - disabled for security
user default off

# Application user - limited permissions
user appuser on >app_password ~* +@read +@write +@connection +@transaction -@dangerous -DEBUG -CONFIG -SHUTDOWN -SAVE -BGSAVE -FLUSHDB -FLUSHALL

# Admin user - full access (use only for maintenance)
user admin on >admin_password ~* +@all

# Read-only user for monitoring
user readonly on >readonly_password ~* +@read +PING +INFO
