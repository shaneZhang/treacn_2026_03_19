# PostgreSQL Security Configuration
# Production-hardened settings

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# SSL Configuration
# SSL is disabled for internal container communication
# For production with external access, enable SSL and provide certificates
ssl = off
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'
# ssl_ca_file = '/etc/ssl/certs/ca.crt'
# ssl_crl_file = ''
# ssl_ciphers = 'HIGH:!aNULL:!MD5'
# ssl_prefer_server_ciphers = on
# ssl_ecdh_curve = 'prime256v1'
# ssl_min_protocol_version = 'TLSv1.2'

# Authentication
password_encryption = 'scram-sha-256'
auth_delay.milliseconds = 500

# Logging - Using stderr for container compatibility
log_destination = 'stderr'
logging_collector = off
log_min_messages = 'warning'
log_min_error_statement = 'error'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_replication_commands = on

# Statement Logging (for security auditing)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# Resource Limits
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 4MB
temp_buffers = 8MB
max_prepared_transactions = 0
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-Ahead Logging
wal_level = 'replica'
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Replication (if needed)
max_wal_senders = 0
max_replication_slots = 0

# Query Tuning
seq_page_cost = 1.0
random_page_cost = 4.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
effective_cache_size = 4GB

# Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# Security Settings
# SSL settings are configured at the top of this file
# Row Level Security
row_security = on

# Prevent loading shared libraries from insecure locations
dynamic_library_path = '$libdir'

# Track activities for monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = 'pl'

# Statistics
# timing_statistics requires additional extensions, commented out for compatibility
# timing_statistics = on

# Lock management
deadlock_timeout = 1s
max_locks_per_transaction = 64

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Error Reporting and Logging
log_min_messages = 'warning'
log_min_error_statement = 'error'
log_min_duration_statement = 1000

# Slow query logging
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'

# Auto explain (for development/debugging only)
# shared_preload_libraries = 'auto_explain'
# auto_explain.log_min_duration = '3s'
# auto_explain.log_analyze = true

